services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rest_api
      DB_PORT: 3306
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rest_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./share/sql/rest_api.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: rest_api
      DB_PORT: 3306
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

volumes:
  mysql_data:
